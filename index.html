'use strict';
const side=document.getElementById('side'),sc=side.getContext('2d');const view=document.getElementById('view'),map=document.getElementById('map'),vc=view.getContext('2d'),mc=map.getContext('2d');let players=[],selected=null,mode='add',drag=null,serial=1,ink=[],drawing=null,selection=new Set(),balls=[];
function oldPaintInk(c,mapper){for(const stroke of ink){if(stroke.points.length<2)continue;let pts=stroke.points.map(p=>mapper(p.x,p.z));c.save();c.strokeStyle=stroke.color;c.lineWidth=5;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.stroke();if(stroke.type==='arrow'){let b=pts[pts.length-1],a=pts[pts.length-2],angle=Math.atan2(b.y-a.y,b.x-a.x);c.beginPath();c.moveTo(b.x-18*Math.cos(angle-.5),b.y-18*Math.sin(angle-.5));c.lineTo(b.x,b.y);c.lineTo(b.x-18*Math.cos(angle+.5),b.y-18*Math.sin(angle+.5));c.stroke()}c.restore()}}
function sp(x,z,h=0){return{x:955-740*z-100*x,y:625-160*x-120*h,scale:1-.25*x}}
function si(x,y,h=0){const a=(625-y-120*h)/160;return{x:a,z:(955-x-100*a)/740}}
function mapFor(canvas){return canvas===map?mp:canvas===side?sp:project}
function inverseFor(canvas,x,y){return canvas===map?mi(x,y):canvas===side?si(x,y):inverse(x,y)}
function pointAt(p,canvas){let q=mapFor(canvas)(p.x,p.z);if(canvas===side)q.y-=120*(p.h||0);else if(canvas===view)q.y-=120*q.scale*(p.h||0);return q}
