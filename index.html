</style><header><h1>排球空間雙視圖</h1><p>同一個站位，從場上看，也從戰術板看。平板橫向操作更方便。</p></header><div class="tools"><div class="tool-row"><strong class="row-title">移動</strong><div class="row-controls"><button id="move">選取／移動</button><button id="multi">多選／整組移動</button><button id="deselect">取消選取</button><button id="del">刪除選取</button></div></div><div class="tool-row"><strong class="row-title">繪圖</strong><div class="row-controls"><button id="pen">畫線</button><button id="arrow">箭頭</button><button id="erase">擦除筆跡</button><label class="file">顏色 <input id="color" type="color" value="#ffcc55" aria-label="筆跡顏色"></label><button id="undoInk">撤銷上一筆</button><button id="clearInk">清除筆跡</button></div></div><div class="tool-row"><strong class="row-title">佔位</strong><div class="row-controls"><button id="add" class="active">＋ 加入人物</button><button id="ball">＋ 排球</button><label class="file">姿勢 <select id="pose"><option value="ready">準備</option><option value="low">低手</option><option value="high">上手</option><option value="run">殺球助跑</option><option value="serve">站姿上手發球</option><option value="spike">殺球</option><option value="block">攔網</option></select></label><button id="applyPose">套用選取姿勢</button><div id="posePreviews" class="pose-previews"></div><button id="p31">後排三人・網前一人</button><button id="p22">前後各兩人</button><button id="clear">清空</button><button id="save">儲存站位</button><label class="file">載入站位<input id="load" type="file" accept="application/json,.json"></label></div></div></div><main><section><h2>第一視角</h2><p class="hint">站在網邊看向對方；點擊地板加入，拖動人物改變站位；場外也可操作；多選後拖動任一人物可整組移動。</p><canvas id="view" width="1100" height="900" aria-label="第一視角人物站位"></canvas><div class="bar"><label><input type="checkbox" id="showNet"> 顯示球網</label><button id="pngView">下載視角圖</button></div></section><section><h2>戰術板</h2><p class="hint">點擊加入白點，拖動白點同步移動人物；可移到場外。</p><canvas id="map" width="700" height="720" aria-label="俯視戰術板"></canvas><div class="bar"><span>上方底線 · 下方網邊</span><button id="pngMap">下載戰術圖</button></div></section></main><div class="stat 'use strict';
const view=document.getElementById('view'),map=document.getElementById('map'),vc=view.getContext('2d'),mc=map.getContext('2d');let players=[],selected=null,mode='add',drag=null,serial=1,ink=[],drawing=null,selection=new Set(),balls=[];
function paintInk(c,mapper){for(const stroke of ink){if(stroke.points.length<2)continue;let pts=stroke.points.map(p=>mapper(p.x,p.z));c.save();c.strokeStyle=stroke.color;c.lineWidth=5;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>c.lineTo(p.x,p.y));c.stroke();if(stroke.type==='arrow'){let b=pts[pts.length-1],a=pts[pts.length-2],angle=Math.atan2(b.y-a.y,b.x-a.x);c.beginPath();c.moveTo(b.x-18*Math.cos(angle-.5),b.y-18*Math.sin(angle-.5));c.lineTo(b.x,b.y);c.lineTo(b.x-18*Math.cos(angle+.5),b.y-18*Math.sin(angle+.5));c.stroke()}c.restore()}}
function ground(q,canvas){let a=canvas===map?mi(q.x,q.y):inverse(q.x,q.y);return valid(a)?a:null}
function eraseAt(q,canvas){const mapper=canvas===map?mp:project;ink=ink.filter(s=>!s.points.some((p,i)=>{let b=mapper(p.x,p.z),a=mapper(s.points[Math.max(0,i-1)].x,s.points[Math.max(0,i-1)].z),dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((q.x-a.x)*dx+(q.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(q.x-a.x-t*dx,q.y-a.y-t*dy)<22}));persist()}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const bounds={xmin:-.4,xmax:1.4,zmin:-.15,zmax:1.5};const valid=p=>Number.isFinite(p.x)&&Number.isFinite(p.z)&&p.x>=bounds.xmin&&p.x<=bounds.xmax&&p.z>=bounds.zmin&&p.z<=bounds.zmax;
// Court coordinates: x = 0..1 left to right, z = 0..1 net to baseline.
// Ground-plane perspective and its exact inverse are shared by both editing surfaces.
function project(x,z){let depth=4+6*z;return{x:550+(x-.5)*4200/depth,y:-200+4200/depth,scale:5/depth}}
function inverse(x,y){let depth=4200/(y+200);return{x:.5+(x-550)*depth/4200,z:(depth-4)/6}}
function mp(x,z){return{x:170+x*360,y:205+(1-z)*360}}function mi(x,y){return{x:(x-170)/360,z:1-(y-205)/360}}
function ellipse(c,x,y,rx,ry,fill){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fillStyle=fill;c.fill()}
const POSES={
ready:{hip:[0,-72],shoulder:[0,-132],head:[0,-172],legs:[[[ -17,-72],[-46,-40],[-59,-6]],[[17,-72],[46,-40],[59,-6]]],arms:[[[-24,-130],[-43,-104],[-42,-79]],[[24,-130],[43,-104],[42,-79]]]},
low:{hip:[-8,-72],shoulder:[6,-128],head:[13,-166],legs:[[[-23,-72],[-47,-37],[-57,-6]],[[8,-72],[43,-39],[59,-6]]],arms:[[[-16,-128],[15,-111],[48,-100]],[[26,-125],[37,-112],[50,-102]]],joined:true},
high:{hip:[0,-76],shoulder:[0,-139],head:[0,-178],legs:[[[-15,-76],[-32,-39],[-38,-6]],[[15,-76],[32,-39],[38,-6]]],arms:[[[-23,-137],[-53,-163],[-18,-216]],[[23,-137],[53,-163],[18,-216]]],open:true},

function person(c,p,outline,preview=false){const q=preview?{x:p.x,y:p.z,scale:p.scale||1}:project(p.x,p.z);const t=POSES[p.pose]||POSES.ready;c.save();c.translate(q.x,q.y);c.scale(q.scale,q.scale);ellipse(c,0,2,70,10,'rgba(0,45,50,.16)');const g=c.createLinearGradient(-60,-230,60,0);g.addColorStop(0,'#fff');g.addColorStop(.65,'#eff5f5');g.addColorStop(1,'#b9ced0');function limb(points,w){c.beginPath();c.moveTo(...points[0]);points.slice(1).forEach(v=>c.lineTo(...v));c.lineCap='round';c.lineJoin='round';c.strokeStyle='#9ab4b7';c.lineWidth=w+2;c.stroke();c.strokeStyle=g;c.lineWidth=w;c.stroke()}
t.legs.forEach(l=>{limb(l,23);ellipse(c,l[2][0]+4,l[2][1],18,7,'#f6fbfb')});let mid=[(t.hip[0]+t.shoulder[0])/2,(t.hip[1]+t.shoulder[1])/2];c.save();c.translate(...mid);c.rotate(Math.atan2(t.hip[0]-t.shoulder[0],t.shoulder[1]-t.hip[1]));ellipse(c,0,0,t.side?22:29,43,g);c.restore();let h=c.createRadialGradient(t.head[0]-10,t.head[1]-12,2,...t.head,30);h.addColorStop(0,'#fff');h.addColorStop(1,'#cfdee0');ellipse(c,...t.head,30,31,h);t.arms.forEach((l,i)=>{limb(l,14);const hand=l[2];ellipse(c,...hand,8,10,'#fafdfd');if(t.open){let v=[hand[0]-l[1][0],hand[1]-l[1][1]],len=Math.hypot(...v),ux=v[0]/len,uy=v[1]/len;for(let f=-1;f<=2;f++)limb([[hand[0]-uy*f*4,hand[1]+ux*f*4],[hand[0]+ux*14-uy*f*5,hand[1]+uy*14+ux*f*5]],3);limb([[hand[0],hand[1]],[hand[0]-uy*12,hand[1]+ux*12]],4)}});if(t.joined)ellipse(c,49,-101,10,8,'white');if(outline){c.strokeStyle='#eeb45a';c.lineWidth=3;c.beginPath();c.ellipse(0,2,78,15,0,0,Math.PI*2);c.stroke()}c.restore()}
function courtPath(c){let a=project(0,0),b=project(1,0),d=project(1,1),e=project(0,1);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.lineTo(d.x,d.y);c.lineTo(e.x,e.y);c.closePath()}
function volleyball(c,x,y,r){c.save();c.translate(x,y);c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.clip();c.fillStyle='#ffda36';c.fillRect(-r,-r,2*r,2*r);for(let i=0;i<3;i++){c.save();c.rotate(i*Math.PI*2/3);c.fillStyle='#176ac2';c.beginPath();c.moveTo(0,0);c.bezierCurveTo(r*.7,-r*.1,r*.9,-r*.6,r*.35,-r);c.lineTo(-r*.2,-r);c.bezierCurveTo(r*.3,-r*.5,r*.3,-r*.2,0,0);c.fill();c.strokeStyle='rgba(25,45,65,.4)';c.lineWidth=Math.max(1,r*.04);c.stroke();c.restore()}let shine=c.createRadialGradient(-r*.35,-r*.4,0,0,0,r);shine.addColorStop(0,'rgba(255,255,255,.55)');shine.addColorStop(1,'rgba(0,0,0,.12)');c.fillStyle=shine;c.fillRect(-r,-r,2*r,2*r);c.restore();c.strokeStyle='#33586a';c.lineWidth=1;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke()}
function paintNet(){const left=project(0,0),right=project(1,0);const bottom=left.y-100,top=project(.5,1/3).y;vc.save();vc.strokeStyle='rgba(35,48,50,.55)';vc.lineWidth=2;const step=(right.x-left.x)/18;for(let x=left.x;x<=right.x+.1;x+=step){vc.beginPath();vc.moveTo(x,top);vc.lineTo(x,bottom);vc.stroke()}for(let y=top;y<=bottom;y+=step){vc.beginPath();vc.moveTo(left.x,y);vc.lineTo(right.x,y);vc.stroke()}vc.fillStyle='#f5f5ef';vc.fillRect(left.x,top-7,right.x-left.x,14);vc.fillRect(left.x,bottom-4,right.x-left.x,8);vc.fillStyle='#637274';vc.fillRect(left.x-9,top-25,8,left.y-top+25);vc.fillRect(right.x+1,top-25,8,right.y-top+25);vc.restore()}
function draw(clean=false){let bg=vc.createLinearGradient(0,0,0,900);bg.addColorStop(0,'#cfbfb0');bg.addColorStop(1,'#e5d8cc');vc.fillStyle=bg;vc.fillRect(0,0,1100,900);courtPath(vc);let floor=vc.createLinearGradient(0,300,0,900);floor.addColorStop(0,'#20a4af');floor.addColorStop(1,'#0897aa');vc.fillStyle=floor;vc.fill();vc.strokeStyle='white';vc.lineWidth=3;vc.stroke();let a=project(0,1/3),b=project(1,1/3);vc.beginPath();vc.moveTo(a.x,a.y);vc.lineTo(b.x,b.y);vc.stroke();paintInk(vc,project);[...players].sort((a,b)=>b.z-a.z).forEach(p=>person(vc,p,!clean&&selection.has(p.id)));mc.fillStyle='#ede5dc';mc.fillRect(0,0,700,720);mc.fillStyle='#149fae';mc.fillRect(170,205,360,360);mc.strokeStyle='white';mc.lineWidth=4;mc.strokeRect(170,205,360,360);let line=mp(0,1/3).y;mc.beginPath();mc.moveTo(170,line);mc.lineTo(530,line);mc.stroke();mc.strokeStyle='#34484a';mc.lineWidth=6;mc.beginPath();mc.moveTo(160,565);mc.lineTo(540,565);mc.stroke();paintInk(mc,mp);players.forEach(p=>{let q=mp(p.x,p.z);ellipse(mc,q.x,q.y,17,17,'white');mc.strokeStyle=!clean&&selection.has(p.id)?'#e9a63c':'#516b6d';mc.lineWidth=3;mc.stroke()});balls.forEach(p=>{let q=project(p.x,p.z);volleyball(vc,q.x,q.y-35*q.scale,20*q.scale);let a=mp(p.x,p.z);volleyball(mc,a.x,a.y,12);if(!clean&&selection.has(p.id)){mc.strokeStyle='#e9a63c';mc.lineWidth=3;mc.strokeRect(a.x-17,a.y-17,34,34)}});if(document.getElementById('showNet').checked)paintNet();document.getElementById('status').textContent=`場上 ${players.length} 人${selection.size?' · 已選取 '+selection.size+' 人':''}｜${mode==='add'?'點擊空白場地加入人物':['pen','arrow','erase'].includes(mode)?'在場內或場外繪圖，兩個視圖同步':'拖動選取的人物或白點，整組同步移動'}｜站位自動保存在此瀏覽器。`}
function persist(){try{localStorage.setItem('volleyDualV1',JSON.stringify(players));localStorage.setItem('volleyInkV1',JSON.stringify(ink));localStorage.setItem('volleyBallsV1',JSON.stringify(balls))}catch{}draw()}

function position(e,canvas){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}

[view,map].forEach(canvas=>{canvas.addEventListener('pointerdown',e=>{e.preventDefault();let q=position(e,canvas);if(mode==='erase'){drag={erase:true};canvas.setPointerCapture(e.pointerId);eraseAt(q,canvas);return}if(mode==='pen'||mode==='arrow'){let a=ground(q,canvas);if(!a)return;drawing={type:mode,color:document.getElementById('color').value,points:[a]};ink.push(drawing);canvas.setPointerCapture(e.pointerId);persist();return}let p=hit(q,canvas);if(p){selected=p.id;if(mode==='multi'||e.shiftKey){if(e.shiftKey&&selection.has(p.id)){selection.delete(p.id);persist();return}selection.add(p.id)}else if(!selection.has(p.id)){selection.clear();selection.add(p.id)}let a=canvas===map?mp(p.x,p.z):project(p.x,p.z);drag={id:p.id,dx:q.x-a.x,dy:q.y-a.y,start:{x:p.x,z:p.z},group:[...players,...balls].filter(v=>selection.has(v.id)).map(v=>({id:v.id,x:v.x,z:v.z}))};canvas.setPointerCapture(e.pointerId)}else{let a=canvas===map?mi(q.x,q.y):inverse(q.x,q.y);if(valid(a)&&(mode==='add'||mode==='ball')){p={id:serial++,x:clamp(a.x,bounds.xmin,bounds.xmax),z:clamp(a.z,bounds.zmin,bounds.zmax)};if(mode==='ball')balls.push(p);else{p.pose=document.getElementById('pose').value;players.push(p)}selected=p.id;selection.clear();selection.add(p.id)}else if(mode!=='multi'){selected=null;selection.clear()}}persist()});canvas.addEventListener('pointermove',e=>{if(drag||drawing)e.preventDefault();let q=position(e,canvas);if(drawing){let a=ground(q,canvas);if(a){if(drawing.type==='arrow')drawing.points=[drawing.points[0],a];else drawing.points.push(a);persist()}return}if(!drag)return;if(drag.erase){eraseAt(q,canvas);return}let a=canvas===map?mi(q.x-drag.dx,q.y-drag.dy):inverse(q.x-drag.dx,q.y-drag.dy);if(!Number.isFinite(a.z))return;let dx=a.x-drag.start.x,dz=a.z-drag.start.z;dx=clamp(dx,Math.max(...drag.group.map(p=>bounds.xmin-p.x)),Math.min(...drag.group.map(p=>bounds.xmax-p.x)));dz=clamp(dz,Math.max(...drag.group.map(p=>bounds.zmin-p.z)),Math.min(...drag.group.map(p=>bounds.zmax-p.z)));drag.group.f function preset(kind){players=(kind===31?[[.5,.15],[.17,.75],[.5,.8],[.83,.75]]:[[.3,.2],[.7,.2],[.2,.8],[.8,.8]]).map(([x,z])=>({id:serial++,x,z}));selected=null;selection.clear();persist()}
function download(name,blob){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.getElementById('add').onclick=()=>setMode('add');document.getElementById('move').onclick=()=>setMode('move');document.getElementById('del').onclick=()=>{players=players.filter(p=>!selection.has(p.id));balls=balls.filter(p=>!selection.has(p.id));selected=null;selection.clear();persist()};document.getElementById('clear').onclick=()=>{players=[];balls=[];selected=null;selection.clear();persist()};document.getElementById('p31').onclick=()=>preset(31);document.getElementById('p22').onclick=()=>preset(22);document.getElementById('save').onclick=()=>download('排球站位.json',new Blob([JSON.stringify({version:3,players,balls,ink,showNet:document.getElementById('showNet').checked},null,2)],{type:'application/json'}));document.getElementById('load').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.players)||data.players.length>100||!data.players.every(p=>valid(p)))throw Error();document.getElementById('showNet').checked=data.showNet===true;players=data.players.map(p=>({id:serial++,x:p.x,z:p.z,pose:['ready','low','high','run','serve','spike','block'].includes(p.pose)?p.pose:'ready'}));balls=Array.isArray(data.balls)?data.balls.filter(valid).slice(0,100).map(p=>({id:serial++,x:p.x,z:p.z})):[];ink=Array.isArray(data.ink)?data.ink.filter(s=>['pen','arrow'].includes(s.type)&&/^#[0-9a-f]{6}$/i.test(s.color)&&Array.isArray(s.points)&&s.points.length<=10000&&s.points.every(p=>valid(p))):[];selected=null;selection.clear();persist()}catch{alert('請載入由此工具儲存的有效站位 JSON 檔。')}e.target.value=''};function exportPNG(canvas,name){draw(true);canvas.toBlob(b=>{if(b)download(name,b);draw()},'image/png')}document.getElementById('pngView').onclick=()=>exportPNG(view,'第一視角.png');document.getElementById('pngMap').onclick=()=>exportPNG(map,'戰術板.png');document.getElementById('deselect').onclick=()=>{selection.clear();selected=null;draw()};['ball','multi','pen','arrow','erase'].forEach(id=>document.getElementById(id).onclick=()=>setMode(id));document.getElementById('undoInk').onclick=()=>{ink.pop();persist()};document.getElementById('clearInk').onclick=()=>{ink=[];persist()};try{let saved=JSON.parse(localStorage.getItem('volleyInkV1'));if(Array.isArray(saved))ink=saved.filter(s=>Array.isArray(s.points)&&s.points.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.z)))}catch{}document.getElementById('showNet').onchange=()=>{try{localStorage.setItem('volleyNetV1',document.getElementById('showNet').checked?'1':'0')}catch{}draw()};try{document.getElementById('showNet').checked=localStorage.getItem('volleyNetV1')==='1'}catch{}const poseNames={ready:'準備',low:'低手',high:'上手',run:'殺球助跑',serve:'站姿上手發球',spike:'殺球',block:'攔網'};const posePanel=document.getElementById('posePreviews');if(posePanel.appendChild)Object.entries(poseNames).forEach(([key,name])=>{let btn=document.createElement('button');btn.className='pose-card';btn.type='button';btn.setAttribute('aria-label',name);let canvas=document.createElement('canvas');canvas.width=150;canvas.height=200;btn.appendChild(canvas);let label=document.createElement('span');label.textContent=name;btn.appendChild(label);let ctx=canvas.getContext('2d');ctx.fillStyle='#e5f0ef';ctx.fillRect(0,0,150,200);person(ctx,{x:75,z:190,scale:.58,pose:key},false,true);btn.onclick=()=>{document.getElementById('pose').value=key;players.filter(p=>selection.has(p.id)).forEach(p=>p.pose=key);posePanel.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===btn));persist()};posePanel.appendChild(btn)});
document.getElementById('applyPose').onclick=()=>{players.filter(p=>selection.has(p.id)).forEach(p=>p.pose=document.getElementById('pose').value);persist()};try{let saved=JSON.parse(localStorage.getItem('volleyBallsV1'));if(Array.isArray(saved))balls=saved.filter(valid).map(p=>({id:100000+serial++,x:p.x,z:p.z}))}catch{}window.addEventListener('keydown',e=>{if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();document.getElementById('del').click()}});try{let data=JSON.parse(localStorage.getItem('volleyDualV1'));if(Array.isArray(data)&&data.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.z))){players=data.map(p=>({id:serial++,x:clamp(p.x,bounds.xmin,bounds.xmax),z:clamp(p.z,bounds.zmin,bounds.zmax),pose:p.pose||'ready'}))}else preset(31)}catch{preset(31)}draw();
</script></html>
